[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-lsa"
version = "0.1.0"
description = "Reproducible DeFi incident data-readiness pipeline"
requires-python = ">=3.10"
dependencies = [
	"eth-abi>=6.0",
	"eth-hash[pycryptodome]>=0.8",
	"eth-utils>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
parquet = ["pyarrow>=16"]
aws = ["s3fs>=2024.3"]

[project.scripts]
defi_lsa = "defi_lsa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
